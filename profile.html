<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORTREX FX — Your Profile</title>
<link rel="icon" href="https://base44.app/api/apps/6a73016f9b626430a0d26f88/files/mp/public/6a73016f9b626430a0d26f88/78f5d4bc5_fortrex-icon-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.profile-page{max-width:560px;margin:0 auto;padding:0 24px 60px;position:relative;z-index:2}
.profile-hero{text-align:center;padding:36px 0 22px;position:relative;z-index:2}
.profile-hero-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.3em;color:var(--gold-light);text-transform:uppercase;margin-bottom:14px;display:inline-flex;align-items:center;gap:8px}
.profile-hero-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,3.5vw,30px);font-weight:700;letter-spacing:-0.02em;color:var(--text);margin-bottom:8px}
.profile-hero-sub{font-size:13px;color:var(--text-muted);max-width:380px;margin:0 auto}
.profile-card{background:var(--card-bg);border:1px solid var(--glass-border);border-radius:20px;padding:40px 36px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(6,7,10,0.4);text-align:center;position:relative;overflow:hidden;opacity:0;transform:translateY(15px);animation:board-enter 0.7s var(--spring) 0.1s forwards}
.profile-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-light),transparent)}
.profile-badge{display:inline-block;padding:8px 20px;background:var(--gold-dim);border:1px solid rgba(234,179,8,0.2);border-radius:100px;font-size:12px;font-weight:700;color:var(--gold-light);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:20px;position:relative;z-index:2}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--gold-deep),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--obsidian-950);margin:0 auto 16px;box-shadow:0 8px 28px var(--gold-dim);position:relative;z-index:2}
.profile-name{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin-bottom:4px;position:relative;z-index:2}
.profile-spot{font-size:13px;color:var(--text-muted);margin-bottom:28px;font-family:'JetBrains Mono',monospace;position:relative;z-index:2}
.profile-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:28px;padding:20px 0;border-top:1px solid var(--glass-border);border-bottom:1px solid var(--glass-border);position:relative;z-index:2}
.profile-stat{text-align:center}
.profile-stat-num{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;color:var(--gold-light)}
.profile-stat-label{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);margin-top:4px}
.profile-referral{background:linear-gradient(135deg,rgba(234,179,8,0.06),rgba(234,179,8,0.01));border:1px solid var(--gold-dim);border-radius:14px;padding:24px;margin-top:24px;text-align:left;position:relative;z-index:2}
.profile-referral-title{font-size:15px;font-weight:700;color:var(--gold-light);margin-bottom:8px;font-family:'Space Grotesk',sans-serif}
.profile-referral-desc{font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.5}
.profile-referral-link{display:flex;gap:8px;align-items:center}
.profile-referral-link input{flex:1;padding:10px 14px;background:rgba(0,0,0,0.3);border:1px solid var(--glass-border);border-radius:8px;color:var(--gold-light);font-size:12px;font-family:'JetBrains Mono',monospace;outline:none;min-width:0}
.btn-copy{padding:10px 16px;background:var(--gold-dim);border:1px solid rgba(234,179,8,0.2);border-radius:8px;color:var(--gold-light);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.25s var(--spring);white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif}
.btn-copy:hover{background:rgba(234,179,8,0.2);transform:translateY(-1px)}
.btn-copy.copied{background:rgba(74,222,128,0.15);color:#4ade80;border-color:rgba(74,222,128,0.3)}
.profile-referral-share{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.share-btn-sm{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;transition:all 0.25s var(--spring);display:inline-flex;align-items:center;gap:4px}
.share-btn-sm.wa{background:rgba(37,211,102,0.15);color:#25d366;border:1px solid rgba(37,211,102,0.3)}
.share-btn-sm.tg{background:rgba(0,136,204,0.15);color:#0088cc;border:1px solid rgba(0,136,204,0.3)}
.share-btn-sm.x{background:rgba(255,255,255,0.08);color:var(--text);border:1px solid rgba(255,255,255,0.15)}
.share-btn-sm:hover{transform:translateY(-1px)}
.profile-connect{margin-top:28px;text-align:center;position:relative;z-index:2}
.profile-connect-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;font-family:'Space Grotesk',sans-serif}
.profile-social-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.profile-back{text-align:center;margin-top:24px;position:relative;z-index:2}
.profile-back a{font-size:13px;color:var(--text-dim);text-decoration:none;transition:color 0.25s var(--spring)}
.profile-back a:hover{color:var(--gold-light)}
.not-registered{text-align:center}
.not-registered h2{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:12px;position:relative;z-index:2}
.not-registered p{font-size:14px;color:var(--text-muted);margin-bottom:24px;position:relative;z-index:2}
@media(max-width:480px){
  .profile-social-grid{grid-template-columns:1fr 1fr;gap:8px}
  .profile-card{padding:32px 22px}
  .profile-hero{padding:28px 0 18px}
}
</style>
</head>
<body class="bg-obsidian-950 text-zinc-100 font-body antialiased overflow-x-hidden">

<div class="bg-mesh"></div>
<div class="bg-radial-glow"></div>

<nav class="nav-bar" id="nav">
  <a href="index.html" class="nav-brand">
    <div class="logo-flip"><div class="logo-flip-inner">
      <div class="logo-face logo-face-front"><img src="https://base44.app/api/apps/6a73016f9b626430a0d26f88/files/mp/public/6a73016f9b626430a0d26f88/78f5d4bc5_fortrex-icon-96.png" alt="FORTREX"></div>
      <div class="logo-face logo-face-back"><span>FX</span></div>
    </div></div>
    <span class="nav-brand-text">FORTREX</span>
  </a>
  <div class="nav-cta"><a href="https://discord.gg/propchampions" target="_blank" class="nav-cta-btn discord-mode">Enter the Citadel →</a></div>
</nav>

<main style="position:relative;z-index:2;padding-top:64px;min-height:100vh">
  <div class="profile-hero">
    <div class="profile-hero-eyebrow"><span class="live-dot"></span> Genesis Dashboard</div>
    <h1 class="profile-hero-title">Welcome back, architect.</h1>
    <p class="profile-hero-sub">Your allocation is locked. Your circle is yours to build.</p>
  </div>
  <div class="profile-page" id="profile-content"></div>
</main>

<footer>
  <div class="footer-logo">FORTREX FX</div>
  <div class="footer-tagline">Where traders rise.</div>
  <div class="footer-copy">© 2026 FORTREX FX · By invitation only</div>
</footer>

<script>
const userData = JSON.parse(localStorage.getItem('fortrex_user') || 'null');
const content = document.getElementById('profile-content');
if (!userData) {
  content.innerHTML = `<div class="profile-card not-registered"><h2>You haven't registered yet.</h2><p>Reserve your spot before the gates close. Only the first 10,000 get Genesis access.</p><a href="index.html#register" class="btn-gold-shimmer">Reserve Your Spot →</a></div>`;
} else {
  const initials = userData.name.substring(0, 2).toUpperCase();
  const refUrl = window.location.origin + window.location.pathname.replace('profile.html', '') + '?ref=' + userData.refCode;
  const shareText = encodeURIComponent("I just secured my Genesis Pass on FORTREX FX — something big is coming for traders. Only 10,000 spots. Reserve yours:");
  const shareUrl = encodeURIComponent(refUrl);
  content.innerHTML = `
    <div class="profile-card">
      <div class="profile-badge">Genesis Member</div>
      <div class="profile-avatar">${initials}</div>
      <div class="profile-name">${userData.name}</div>
      <div class="profile-spot">Member #${userData.spotNumber || '848'}</div>
      <div class="profile-stats">
        <div class="profile-stat"><div class="profile-stat-num">${userData.spotNumber || '848'}</div><div class="profile-stat-label">Your Spot</div></div>
        <div class="profile-stat"><div class="profile-stat-num">0</div><div class="profile-stat-label">Invited</div></div>
        <div class="profile-stat"><div class="profile-stat-num">0</div><div class="profile-stat-label">REX Earned</div></div>
      </div>
      <div class="profile-referral">
        <div class="profile-referral-title">📎 Spread the word</div>
        <div class="profile-referral-desc">Share your personal link with fellow traders. Every trader who joins through you adds to your REX bonus at launch.</div>
        <div class="profile-referral-link"><input type="text" value="${refUrl}" readonly id="ref-link-input"><button class="btn-copy" id="copy-btn">Copy</button></div>
        <div class="profile-referral-share">
          <a href="https://wa.me/?text=${shareText}%20${shareUrl}" target="_blank" class="share-btn-sm wa">WhatsApp</a>
          <a href="https://t.me/share/url?url=${shareUrl}&text=${shareText}" target="_blank" class="share-btn-sm tg">Telegram</a>
          <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" class="share-btn-sm x">X / Twitter</a>
        </div>
      </div>
      <div class="profile-connect">
        <div class="profile-connect-title">Connect with us for updates</div>
        <div class="profile-social-grid">
          <a href="https://discord.gg/propchampions" target="_blank" class="community-social-card discord-anim" style="--delay:0">
            <div class="community-social-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.25-.34.52-.46.79a13.1 13.1 0 0 0-3.94 0c-.12-.27-.28-.54-.46-.79a.09.09 0 0 0-.07-.03c-1.5.26-2.94.71-4.27 1.33a.08.08 0 0 0-.04.03C3.58 9.48 2.97 13.5 3.27 17.48a.1.1 0 0 0 .04.07c1.8 1.32 3.54 2.12 5.25 2.65a.09.09 0 0 0 .1-.03c.4-.55.76-1.13 1.07-1.74a.08.08 0 0 0-.05-.12c-.57-.22-1.11-.48-1.64-.79a.08.08 0 0 1-.01-.13l.33-.26a.08.08 0 0 1 .08-.01c3.44 1.57 7.15 1.57 10.55 0a.08.08 0 0 1 .08.01l.33.26a.08.08 0 0 1-.01.13c-.53.31-1.07.57-1.64.79a.08.08 0 0 0-.04.12c.32.61.68 1.19 1.07 1.74a.09.09 0 0 0 .1.03c1.72-.53 3.46-1.33 5.26-2.65a.1.1 0 0 0 .04-.07c.36-4.61-.59-8.6-2.52-12.12a.07.07 0 0 0-.04-.03zM10.02 15.12c-1.04 0-1.9-.95-1.9-2.12s.84-2.12 1.9-2.12c1.07 0 1.92.96 1.9 2.12 0 1.17-.84 2.12-1.9 2.12zm7.02 0c-1.04 0-1.9-.95-1.9-2.12s.84-2.12 1.9-2.12c1.07 0 1.92.96 1.9 2.12 0 1.17-.83 2.12-1.9 2.12z" fill="#5865F2"/></svg></div>
            <div class="community-social-name">Discord</div>
            <div class="community-social-desc">VIP Channel</div>
          </a>
          <a href="https://youtube.com" target="_blank" class="community-social-card yt-anim" style="--delay:1">
            <div class="community-social-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6a3 3 0 0 0-2.1 2.1A31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z" fill="#FF0000"/></svg></div>
            <div class="community-social-name">YouTube</div>
            <div class="community-social-desc">Trade Media</div>
          </a>
          <a href="https://instagram.com" target="_blank" class="community-social-card insta-anim" style="--delay:2">
            <div class="community-social-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.16-.42-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41 1.27-.06 1.65-.07 4.85-.07M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.31-1.46.72-2.13 1.39C1.34 2.69.93 3.36.63 4.14.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.31.79.72 1.46 1.39 2.13.67.67 1.34 1.08 2.13 1.39.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56.79-.31 1.46-.72 2.13-1.39.67-.67 1.08-1.34 1.39-2.13.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91-.31-.79-.72-1.46-1.39-2.13C21.31 1.34 20.64.93 19.86.63c-.76-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84zm0 10.16A4 4 0 1 1 16 12a4 4 0 0 1-4 4zm6.41-10.41a1.44 1.44 0 1 0 1.44 1.44 1.44 1.44 0 0 0-1.44-1.44z" fill="#E1306C"/></svg></div>
            <div class="community-social-name">Instagram</div>
            <div class="community-social-desc">Daily Alpha</div>
          </a>
          <a href="https://threads.net" target="_blank" class="community-social-card threads-anim" style="--delay:3">
            <div class="community-social-icon"><svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M17.3 11.2c-.1-.05-.2-.1-.3-.14-.2-4.2-2.5-6.6-6.4-6.6-2.3 0-4.1 1-5.3 2.8l2.1 1.5c.9-1.3 2.1-1.6 3.2-1.6 1.3 0 2.3.5 3 1.4.4.6.6 1.3.7 2.2-.9-.2-1.8-.3-2.9-.3-3.4 0-5.5 2-5.4 4.5.1 1.3.7 2.4 1.7 3.2 1 .7 2.2 1.1 3.5 1 .1.7.1 1.2.1 1.2s2.5-.3 4-2c.3 2 .3 2 .3 2s.4-1 .2-2.8c1.1-1.3 1.9-3.1 2-5.4z" fill="#fff"/></svg></div>
            <div class="community-social-name">Threads</div>
            <div class="community-social-desc">Live Feed</div>
          </a>
        </div>
      </div>
    </div>
    <div class="profile-back"><a href="index.html">← Back to FORTREX FX</a></div>`;
  const copyBtn = document.getElementById('copy-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      const input = document.getElementById('ref-link-input');
      input.select(); document.execCommand('copy');
      copyBtn.textContent = 'Copied!'; copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 2000);
    });
  }
}
</script>
</body>
</html>
