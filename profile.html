<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORTREX FX — Your Profile</title>
<link rel="icon" href="https://base44.app/api/apps/6a73016f9b626430a0d26f88/files/mp/public/6a73016f9b626430a0d26f88/78f5d4bc5_fortrex-icon-96.png">
<link rel="stylesheet" href="css/style.css">
<style>
.profile-page { max-width: 560px; margin: 100px auto; padding: 0 32px; }
.profile-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px; backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(6,7,10,0.4); text-align: center; }
.profile-badge { display: inline-block; padding: 8px 20px; background: rgba(229,193,88,0.1); border: 1px solid rgba(229,193,88,0.2); border-radius: 100px; font-size: 12px; font-weight: 700; color: var(--gold-light); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 20px; }
.profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-light)); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #0A0B0F; margin: 0 auto 16px; }
.profile-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.profile-spot { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; font-family: 'JetBrains Mono', monospace; }
.profile-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 28px; padding: 20px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.profile-stat { text-align: center; }
.profile-stat-num { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 800; color: var(--gold-light); }
.profile-stat-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-top: 4px; }
.profile-referral { background: linear-gradient(135deg, rgba(212,175,55,0.06), rgba(212,175,55,0.02)); border: 1px solid rgba(229,193,88,0.15); border-radius: 14px; padding: 24px; margin-top: 24px; text-align: left; }
.profile-referral-title { font-size: 15px; font-weight: 700; color: var(--gold-light); margin-bottom: 8px; }
.profile-referral-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }
.profile-referral-link { display: flex; gap: 8px; align-items: center; }
.profile-referral-link input { flex: 1; padding: 10px 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; color: var(--gold-light); font-size: 12px; font-family: 'JetBrains Mono', monospace; outline: none; }
.btn-copy { padding: 10px 16px; background: rgba(229,193,88,0.1); border: 1px solid rgba(229,193,88,0.2); border-radius: 8px; color: var(--gold-light); font-size: 13px; cursor: pointer; transition: all 0.25s; white-space: nowrap; }
.btn-copy:hover { background: rgba(229,193,88,0.2); }
.btn-copy.copied { background: rgba(34,197,94,0.15); color: #4ade80; border-color: rgba(74,222,128,0.3); }
.profile-referral-share { display: flex; gap: 8px; margin-top: 12px; }
.share-btn-sm { padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none; transition: all 0.25s; display: inline-flex; align-items: center; gap: 4px; }
.share-btn-sm.wa { background: rgba(37,211,102,0.15); color: #25d366; border: 1px solid rgba(37,211,102,0.3); }
.share-btn-sm.tg { background: rgba(0,136,204,0.15); color: #0088cc; border: 1px solid rgba(0,136,204,0.3); }
.share-btn-sm.x { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
.share-btn-sm:hover { transform: translateY(-1px); }
.profile-connect { margin-top: 28px; text-align: center; }
.profile-connect-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 14px; }
.profile-connect-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.profile-back { text-align: center; margin-top: 24px; }
.profile-back a { font-size: 13px; color: var(--text-dim); text-decoration: none; transition: color 0.25s; }
.profile-back a:hover { color: var(--gold-light); }
.not-registered { text-align: center; }
.not-registered h2 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
.not-registered p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<nav class="nav">
  <a href="index.html" class="nav-brand-wrap">
    <div class="logo-flip"><div class="logo-flip-inner">
      <div class="logo-face logo-face-front"><img src="https://base44.app/api/apps/6a73016f9b626430a0d26f88/files/mp/public/6a73016f9b626430a0d26f88/78f5d4bc5_fortrex-icon-96.png" alt="FORTREX"></div>
      <div class="logo-face logo-face-back"><span>FX</span></div>
    </div></div>
    <span class="nav-brand-text">FORTREX</span>
  </a>
  <div class="nav-cta"><a href="https://discord.gg/propchampions" target="_blank" class="nav-cta-btn discord-mode">Enter the Citadel →</a></div>
</nav>
<main style="padding-top: 64px;">
  <div class="profile-page" id="profile-content"></div>
</main>
<script>
const userData = JSON.parse(localStorage.getItem('fortrex_user') || 'null');
const content = document.getElementById('profile-content');
if (!userData) {
  content.innerHTML = `<div class="profile-card not-registered"><h2>You haven't registered yet.</h2><p>Reserve your spot before the gates close. Only the first 10,000 get Genesis access.</p><a href="index.html#register" class="btn-primary">Reserve Your Spot →</a></div>`;
} else {
  const initials = userData.name.substring(0, 2).toUpperCase();
  const refUrl = window.location.origin + window.location.pathname.replace('profile.html', '') + '?ref=' + userData.refCode;
  const shareText = encodeURIComponent("I just secured my spot on FORTREX FX — something big is coming for traders. Only 10,000 spots. Reserve yours:");
  const shareUrl = encodeURIComponent(refUrl);
  content.innerHTML = `
    <div class="profile-card">
      <div class="profile-badge">Genesis Member</div>
      <div class="profile-avatar">${initials}</div>
      <div class="profile-name">${userData.name}</div>
      <div class="profile-spot">Member #${userData.spotNumber || '848'}</div>
      <div class="profile-stats">
        <div class="profile-stat"><div class="profile-stat-num">${userData.spotNumber || '848'}</div><div class="profile-stat-label">Your Spot</div></div>
        <div class="profile-stat"><div class="profile-stat-num">0</div><div class="profile-stat-label">Invited</div></div>
        <div class="profile-stat"><div class="profile-stat-num">0</div><div class="profile-stat-label">REX Earned</div></div>
      </div>
      <div class="profile-referral">
        <div class="profile-referral-title">📎 Spread the word</div>
        <div class="profile-referral-desc">Share your personal link with fellow traders. Every trader who joins through you adds to your REX bonus at launch.</div>
        <div class="profile-referral-link"><input type="text" value="${refUrl}" readonly id="ref-link-input"><button class="btn-copy" id="copy-btn">Copy</button></div>
        <div class="profile-referral-share">
          <a href="https://wa.me/?text=${shareText}%20${shareUrl}" target="_blank" class="share-btn-sm wa">WhatsApp</a>
          <a href="https://t.me/share/url?url=${shareUrl}&text=${shareText}" target="_blank" class="share-btn-sm tg">Telegram</a>
          <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" class="share-btn-sm x">X / Twitter</a>
        </div>
      </div>
      <div class="profile-connect">
        <div class="profile-connect-title">Connect with us for updates</div>
        <div class="profile-connect-buttons">
          <a href="https://discord.gg/propchampions" target="_blank" class="connect-btn discord">Join the Citadel</a>
          <a href="https://youtube.com" target="_blank" class="connect-btn yt">YouTube</a>
          <a href="https://instagram.com" target="_blank" class="connect-btn insta">Instagram</a>
          <a href="https://threads.net" target="_blank" class="connect-btn threads">Threads</a>
        </div>
      </div>
    </div>
    <div class="profile-back"><a href="index.html">← Back to FORTREX FX</a></div>`;
  const copyBtn = document.getElementById('copy-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      const input = document.getElementById('ref-link-input');
      input.select(); document.execCommand('copy');
      copyBtn.textContent = 'Copied!'; copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 2000);
    });
  }
}
</script>
</body>
</html>
