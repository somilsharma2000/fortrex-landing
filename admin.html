<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORTREX FX — Admin Panel</title>
<link rel="icon" href="https://base44.app/api/apps/6a73016f9b626430a0d26f88/files/mp/public/6a73016f9b626430a0d26f88/78f5d4bc5_fortrex-icon-96.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root {
  --obsidian: #06070A; --gold: #D4AF37; --gold-light: #E5C158;
  --text: #F0F0F0; --text-muted: rgba(240,240,240,0.55); --text-dim: rgba(240,240,240,0.3);
  --border: rgba(229,193,88,0.12); --card-bg: rgba(11,12,14,0.7);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--obsidian); color: var(--text); font-family: 'Outfit', sans-serif; -webkit-font-smoothing: antialiased; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(6,7,10,0.9); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); padding: 20px 40px;
  display: flex; align-items: center; justify-content: space-between;
}
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.1em; }
.header h1 span { color: var(--gold-light); }
.stats-bar { display: flex; gap: 24px; }
.stat-item { text-align: right; }
.stat-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--gold-light); }
.stat-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); }

.controls { padding: 20px 40px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.search-box { flex: 1; min-width: 250px; padding: 12px 18px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; outline: none; font-family: 'Outfit', sans-serif; }
.search-box:focus { border-color: rgba(229,193,88,0.3); }
.btn-refresh { padding: 12px 20px; background: rgba(229,193,88,0.1); border: 1px solid rgba(229,193,88,0.2); border-radius: 10px; color: var(--gold-light); font-size: 13px; cursor: pointer; font-family: 'Outfit', sans-serif; transition: all 0.25s; }
.btn-refresh:hover { background: rgba(229,193,88,0.2); }
.live-badge { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.table-wrap { padding: 0 40px 40px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; padding: 16px 20px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; border-bottom: 1px solid var(--border); position: sticky; top: 80px; background: var(--obsidian); }
td { padding: 16px 20px; border-bottom: 1px solid rgba(229,193,88,0.04); color: var(--text); }
tr:hover td { background: rgba(229,193,88,0.02); }
.mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
.gold { color: var(--gold-light); }
.muted { color: var(--text-muted); }

.empty { text-align: center; padding: 80px 40px; color: var(--text-dim); }
.empty h3 { font-size: 18px; margin-bottom: 8px; color: var(--text-muted); }

@media (max-width: 768px) { .header { padding: 16px 20px; flex-direction: column; gap: 12px; } .stats-bar { flex-wrap: wrap; } .controls { padding: 16px 20px; } .table-wrap { padding: 0 20px 40px; } }
</style>
</head>
<body>

<div class="header">
  <h1>FORTREX <span>FX</span> — Admin</h1>
  <div class="stats-bar">
    <div class="stat-item"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total Registered</div></div>
    <div class="stat-item"><div class="stat-value" id="stat-today">0</div><div class="stat-label">Today</div></div>
    <div class="stat-item"><div class="stat-value" id="stat-ref">0</div><div class="stat-label">Via Referral</div></div>
    <div class="stat-item"><div class="stat-value" id="stat-remaining">10,000</div><div class="stat-label">Remaining</div></div>
  </div>
</div>

<div class="controls">
  <input type="text" class="search-box" id="search" placeholder="Search by name, email, or phone...">
  <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
  <div class="live-badge"><span class="live-dot"></span> Auto-refresh 30s</div>
</div>

<div class="table-wrap">
  <table id="data-table">
    <thead>
      <tr>
        <th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Referral Code</th><th>Referred By</th><th>Registered</th>
      </tr>
    </thead>
    <tbody id="data-body">
      <tr><td colspan="8" class="empty"><h3>Connecting to data source...</h3><p>Set your Google Apps Script URL in admin.js</p></td></tr>
    </tbody>
  </table>
</div>

<script>
const APPS_SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
let allData = [];

async function loadData() {
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=all');
    const data = await res.json();
    if (data && data.records) {
      allData = data.records;
      renderTable(allData);
      updateStats(allData);
    }
  } catch (e) {
    // Show demo data
    showDemoData();
  }
}

function showDemoData() {
  const demo = [
    { name: 'Aarav Kapoor', email: 'aarav@example.com', phone: '+91 98765 43210', refCode: 'YWFyYXY', refBy: '', timestamp: '2026-08-14T10:30:00Z' },
    { name: 'Marcus Turner', email: 'marcus@example.com', phone: '+1 555 0100', refCode: 'bWFyY3V', refBy: 'YWFyYXY', timestamp: '2026-08-14T09:15:00Z' },
    { name: 'Priya Sharma', email: 'priya@example.com', phone: '+91 98123 45678', refCode: 'cHJpeWE', refBy: '', timestamp: '2026-08-14T08:45:00Z' },
    { name: 'James Wilson', email: 'james@example.com', phone: '+44 7700 900123', refCode: 'amFtZXM', refBy: 'bWFyY3V', timestamp: '2026-08-13T14:20:00Z' },
    { name: 'Vikram Rao', email: 'vikram@example.com', phone: '+91 90000 11111', refCode: 'dmlrcnJ', refBy: 'YWFyYXY', timestamp: '2026-08-13T11:00:00Z' },
  ];
  allData = demo;
  renderTable(demo);
  updateStats(demo);
}

function renderTable(data) {
  const tbody = document.getElementById('data-body');
  const search = document.getElementById('search').value.toLowerCase();
  const filtered = search ? data.filter(r =>
    r.name.toLowerCase().includes(search) ||
    r.email.toLowerCase().includes(search) ||
    r.phone.includes(search)
  ) : data;

  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty"><h3>No records found</h3></td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map((r, i) => `
    <tr>
      <td class="mono muted">${i + 1}</td>
      <td>${r.name}</td>
      <td class="mono">${r.email}</td>
      <td class="mono">${r.phone}</td>
      <td class="mono gold">${r.refCode}</td>
      <td class="mono muted">${r.refBy || '—'}</td>
      <td class="mono muted">${new Date(r.timestamp).toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' })}</td>
    </tr>
  `).join('');
}

function updateStats(data) {
  document.getElementById('stat-total').textContent = data.length.toLocaleString();
  const today = new Date().toDateString();
  const todayCount = data.filter(r => new Date(r.timestamp).toDateString() === today).length;
  document.getElementById('stat-today').textContent = todayCount.toLocaleString();
  const refCount = data.filter(r => r.refBy).length;
  document.getElementById('stat-ref').textContent = refCount.toLocaleString();
  document.getElementById('stat-remaining').textContent = (10000 - data.length).toLocaleString();
}

document.getElementById('search').addEventListener('input', () => renderTable(allData));
loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
